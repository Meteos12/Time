<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b5cf6">
<title>リディー＆スール 特性ルート検索</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--text:#24212d;--muted:#756f80;--line:#e8e3ef;--main:#8b5cf6;--soft:#f0eaff;--ok:#16845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}
.app{width:min(980px,100%);margin:auto;padding:18px 14px 70px}.top{padding:20px;border-radius:24px;background:linear-gradient(135deg,#fff,#f2edff);border:1px solid #e7defa;box-shadow:0 10px 30px #2d1b4d10}
.eyebrow{font-size:11px;font-weight:800;color:var(--main);letter-spacing:.08em}.top h1{margin:5px 0 7px;font-size:clamp(24px,5vw,34px);letter-spacing:-.03em}.top p{margin:0;color:var(--muted);line-height:1.7;font-size:13px}
.search{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 22px #33234d08}
.fields{display:grid;grid-template-columns:1fr 44px 1fr;gap:10px;align-items:end}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}
select{width:100%;height:52px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);padding:0 12px;font-size:16px;font-weight:750}
.swap{height:52px;border:1px solid var(--line);border-radius:13px;background:var(--soft);color:var(--main);font-size:20px;font-weight:900}
.result{margin-top:14px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 8px}.result-head h2{margin:0;font-size:16px}.count{font-size:12px;color:var(--muted)}
.route{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 5px 16px #33234d08}
.route-title{font-weight:900;font-size:15px}.route-meta{color:var(--muted);font-size:11px;margin-top:3px}.steps{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:14px 0 3px}.step{min-width:105px;padding:10px;border-radius:12px;background:var(--soft);text-align:center}.step .cat{font-size:11px;color:var(--main);font-weight:900}.step .item{font-size:13px;font-weight:850;margin-top:3px}.arrow{color:#aaa;font-weight:900}.note{font-size:11px;color:var(--muted);line-height:1.6}.empty{padding:28px 10px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px}.matrix{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:auto}.matrix table{border-collapse:collapse;min-width:720px;width:100%;font-size:12px}.matrix th,.matrix td{padding:9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}.matrix th{background:#faf8fd;position:sticky;top:0}.matrix .from{text-align:left;font-weight:850;position:sticky;left:0;background:#fff}.hit{background:var(--soft);color:var(--main);font-weight:900;cursor:pointer}.footer{margin-top:14px;text-align:center;color:#918b99;font-size:11px}
@media(max-width:600px){.fields{grid-template-columns:1fr}.swap{width:100%;height:40px}.steps{align-items:stretch}.step{min-width:100px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="eyebrow">LYDIE & SUELLE / TRAIT ROUTE</div><h1>特性引き継ぎルート検索</h1><p>「魚介類の特性を宝石へ」のように、カテゴリをまたいで特性を運ぶ中継調合品を探します。</p></header>
<section class="search">
<div class="fields">
<div class="field"><label>FROM：元カテゴリ</label><select id="from"></select></div>
<button class="swap" id="swap" title="入れ替え">⇄</button>
<div class="field"><label>TO：目的カテゴリ</label><select id="to"></select></div>
</div>
</section>
<section class="result"><div class="result-head"><h2>引き継ぎルート</h2><span class="count" id="count"></span></div><div id="routes"></div></section>
<section class="matrix"><table id="matrix"></table></section>
<p class="footer">※カテゴリ・レシピは確認できたデータを中心に収録。ゲーム内の投入枠・材料カテゴリを優先して使ってください。</p>
</div>
<script>
const routes=[
["魚介類","粘土",["魚介類","おいしそうな練り餌","粘土"]],
["虫","粘土",["虫","おいしそうな練り餌","粘土"]],
["食材","粘土",["食材","おいしそうな練り餌","粘土"]],
["粘土","中和剤",["粘土","中和剤・黄","中和剤"]],
["燃料","中和剤",["燃料","中和剤・赤","中和剤"]],
["油","中和剤",["油","中和剤・青","中和剤"]],
["植物類","中和剤",["植物類","中和剤・緑","中和剤"]],
["毒の材料","中和剤",["毒の材料","中和剤・紫","中和剤"]],
["中和剤","粘土",["中和剤","錬金粘土","粘土"]],
["中和剤","エリキシル",["中和剤","錬金粘土","エリキシル"]],
["粘土","砂",["粘土","ポリッシュ","砂"]],
["粘土","鉱石",["粘土","錬金粘土","ジェット原石","鉱石"]],
["粘土","植物類",["粘土","錬金粘土","ジェット原石","植物類"]],
["粘土","宝石",["粘土","錬金粘土","ジェット原石","宝石"]],
["中和剤","宝石",["中和剤","錬金粘土","金剛原石","宝石"]],
["植物類","紙",["植物類","ゼッテル","紙"]],
["植物類","燃料",["植物類","ゼッテル","燃料"]],
["糸素材","布",["糸素材","クロース","布"]],
["糸素材","防具素材",["糸素材","クロース","防具素材"]],
["鉱石","武器素材",["鉱石","インゴット","武器素材"]],
["鉱石","金属",["鉱石","インゴット","金属"]],
["紙","木材",["紙","地球儀の玉","木材"]],
["紙","魔法の道具",["紙","地球儀の玉","魔法の道具"]],
["中和剤","金属",["中和剤","銀食器セット","金属"]]
];
const cats=[...new Set(routes.flatMap(r=>[r[0],r[1]]))].sort((a,b)=>a.localeCompare(b,"ja"));
const from=document.querySelector("#from"),to=document.querySelector("#to");
function opts(sel,all){sel.innerHTML='<option value="">選択してください</option>'+all.map(x=>'<option>'+x+'</option>').join("")}
opts(from,cats);opts(to,cats);
from.value="魚介類";to.value="宝石";
function direct(a,b){return routes.filter(r=>r[0]===a&&r[1]===b)}
function graph(){const g={};for(const r of routes){(g[r[0]]??=[]).push(r)}return g}
function findRoutes(a,b){
 if(!a||!b)return[]; if(a===b)return[];
 const g=graph(), out=[], q=[[a,[a]]], seen=new Set([a]);
 while(q.length&&out.length<8){
  const [cur,path]=q.shift();
  for(const r of g[cur]||[]){
   const next=r[1]; if(path.includes(next))continue;
   const np=[...path,next];
   if(next===b) out.push(np);
   else if(!seen.has(next)){seen.add(next);q.push([next,np])}
  }
 }
 return out.map(path=>{
  const steps=[path[0]];
  for(let i=0;i<path.length-1;i++){const r=routes.find(x=>x[0]===path[i]&&x[1]===path[i+1]);steps.push(r[2].slice(1,-1).join(" → "));steps.push(path[i+1])}
  const compact=[]; for(let i=0;i<steps.length;i++){if(i===0||i===steps.length-1||i%2===1)compact.push(steps[i])}
  return compact;
 });
}
function render(){
 const a=from.value,b=to.value,r=findRoutes(a,b);document.querySelector("#count").textContent=r.length+"ルート";
 const root=document.querySelector("#routes");
 if(!a||!b){root.innerHTML='<div class="empty">FROMとTOを選んでください。</div>';return}
 if(!r.length){root.innerHTML='<div class="empty">登録されている中継ルートでは到達できません。<br>別カテゴリを経由するデータを追加できます。</div>';return}
 root.innerHTML=r.map((p,i)=>'<article class="route"><div class="route-title">ルート '+(i+1)+' ・ '+p.length-1+'段階</div><div class="steps">'+p.map((x,j)=>'<div class="step"><div class="cat">'+(j%2===0?'カテゴリ':'中継アイテム')+'</div><div class="item">'+x+'</div></div>'+ (j<p.length-1?'<span class="arrow">›</span>':'')).join("")+'</div><div class="note">特性を持たせる素材を最初の材料枠に入れ、各中継アイテムの次カテゴリへ運びます。</div></article>').join("");
}
function renderMatrix(){
 const all=cats;let h='<thead><tr><th>FROM＼TO</th>'+all.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>';
 for(const a of all){h+='<tr><th class="from">'+a+'</th>'+all.map(b=>{const ok=findRoutes(a,b).length>0;return '<td class="'+(ok?'hit':'')+'" data-a="'+a+'" data-b="'+b+'">'+(a===b?'—':ok?'●':'')+'</td>'}).join("")+'</tr>'}
 document.querySelector("#matrix").innerHTML=h+'</tbody>';
 document.querySelectorAll(".hit").forEach(td=>td.onclick=()=>{from.value=td.dataset.a;to.value=td.dataset.b;render();window.scrollTo({top:0,behavior:"smooth"})});
}
from.onchange=render;to.onchange=render;document.querySelector("#swap").onclick=()=>{[from.value,to.value]=[to.value,from.value];render()};
render();renderMatrix();
</script>
</body></html>
